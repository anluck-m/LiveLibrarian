<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>librarian - 近くの図書館で借りられる人気本ランキング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  // 描画前にテーマを確定して、ダーク選択時のちらつき（FOUC）を防ぐ。
  // 保存がなければ属性を付けず、CSS側の prefers-color-scheme に追従させる。
  (function () {
    try {
      var t = localStorage.getItem('librarian:theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
  <header>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="テーマを切り替え">🌙</button>
    <h1 class="brand">
      <span class="brand-mark" aria-hidden="true">📚</span>
      <span class="brand-name">librarian<span class="brand-sub">browser</span></span>
    </h1>
    <p class="tagline">近くの図書館で借りられる人気本ランキング</p>
  </header>

  <main>
    <section class="card" id="step1">
      <h2><span class="step-num">1</span>地域を選んで図書館を探す</h2>

      <!-- 探し方の選択（現在地 / 地域）。最初はこの2択だけを見せる -->
      <div id="modeChooser" class="mode-chooser">
        <!-- 位置情報が使えない環境（非セキュアなURL等）ではJS側で出さないため hidden 始まり -->
        <button type="button" id="modeNearbyBtn" class="mode-card" hidden>
          <span class="mode-icon" aria-hidden="true">📍</span>
          <span class="mode-text">
            <span class="mode-title">現在地から探す</span>
            <span class="mode-desc">近くの図書館を距離順に表示</span>
          </span>
        </button>
        <button type="button" id="modeRegionBtn" class="mode-card">
          <span class="mode-icon" aria-hidden="true">🗾</span>
          <span class="mode-text">
            <span class="mode-title">地域を選んで探す</span>
            <span class="mode-desc">都道府県・市区町村から選ぶ</span>
          </span>
        </button>
      </div>

      <button type="button" id="backToModeBtn" class="back-link" hidden>← 探し方を選ぶ</button>
      <p class="nearby-status" id="nearbyStatus" role="status"></p>

      <div id="regionPanel" hidden>
        <div id="prefMap" class="pref-map" role="group" aria-label="都道府県を選択"></div>

        <div class="form-row">
          <label for="city">市区町村</label>
          <select id="city" disabled>
            <option value="">まず都道府県を選んでください</option>
          </select>
        </div>
        <button id="searchLibrariesBtn">図書館を探す</button>
      </div>
      <p class="error" id="librariesError" role="alert"></p>
    </section>

    <section class="card" id="step2" hidden>
      <h2><span class="step-num">2</span>ジャンルと並び順を選んで本を探す</h2>
      <div id="systemList" class="system-list"></div>
      <div class="form-row">
        <label for="genre">ジャンル</label>
        <select id="genre"></select>
      </div>
      <div class="form-row">
        <label for="sort">並び順</label>
        <select id="sort">
          <option value="reviewCount">定番人気（レビュー数順）</option>
          <option value="sales">売れ筋（販売数順）</option>
        </select>
      </div>
      <button id="showRankingBtn">ランキングを表示</button>
      <p class="error" id="rankingError"></p>
    </section>

    <section id="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>取得中です。図書館の蔵書確認には少し時間がかかります…</p>
    </section>

    <section id="step3">
      <div id="filterBar" class="filter-bar" hidden>
        <span class="filter-label">絞り込み:</span>
        <button type="button" class="filter-btn active" data-filter="all">すべて</button>
        <button type="button" class="filter-btn" data-filter="available">貸出可</button>
        <button type="button" class="filter-btn" data-filter="onloan">貸出中</button>
        <button type="button" class="filter-btn" data-filter="held">蔵書あり</button>
        <span class="filter-count" id="filterCount"></span>
      </div>
      <div id="rankingList" class="ranking-list"></div>
      <div id="pagination" class="pagination" hidden>
        <button type="button" id="prevPageBtn">← 前のページ</button>
        <span id="pageIndicator" class="page-indicator"></span>
        <button type="button" id="nextPageBtn">次のページ →</button>
      </div>
      <div id="collectControls" class="pagination" hidden>
        <button type="button" id="loadMoreBtn">もっと探す</button>
        <span id="collectStatus" class="page-indicator"></span>
      </div>
    </section>
  </main>

  <script src="js/pref-map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
